<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Discord RSS Embed Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:"gg sans",Whitney,"Helvetica Neue",Helvetica,Arial,sans-serif}
body{margin:0;background:#313338;color:#dbdee1;display:flex;align-items:center;justify-content:center;height:100vh}
.chat{width:680px}
.msg{display:flex;gap:16px;padding:4px 48px}
.avatar{width:40px;height:40px;border-radius:50%;background:#5865F2;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:4px}
.body{display:flex;flex-direction:column;gap:2px}
.header{display:flex;align-items:baseline;gap:8px}
.name{font-weight:500;color:#f2f3f5}
.bot{background:#5865F2;color:#fff;font-size:10px;padding:0 4px;border-radius:3px;height:15px;display:flex;align-items:center}
.time{font-size:12px;color:#949ba4}
.content{color:#dbdee1}
.embed{margin-top:8px;max-width:520px;background:#2b2d31;border-radius:4px;border-left:4px solid #5865F2;display:grid;grid-template-columns:1fr auto}
.embed-main{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.embed-author{display:flex;align-items:center;gap:8px;font-size:14px}
.embed-author-dot{width:24px;height:24px;border-radius:50%;background:#5865F2}
.embed-title{color:#00a8fc;font-weight:600;text-decoration:none}
.embed-desc{font-size:14px;white-space:pre-wrap}
.embed-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field-name{font-weight:600;font-size:14px}
.field-value{font-size:14px;color:#dbdee1}
.embed-image{margin-top:4px;border-radius:4px;overflow:hidden}
.embed-image img{display:block;width:100%}
.embed-footer{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:12px;color:#949ba4}
.embed-thumb{width:80px;height:80px;margin:12px 16px 0 0;border-radius:4px;object-fit:cover}
</style>
</head>
<body>
<div class="chat">
  <div class="msg">
    <div class="avatar">R</div>
    <div class="body">
      <div class="header">
        <span class="name">RSS Bot</span>
        <span class="bot">APP</span>
        <span class="time">Сегодня в 12:34</span>
      </div>
      <div class="content">@everyone</div>
      <div class="embed">
        <div>
          <div class="embed-main">
            <div class="embed-author">
              <div class="embed-author-dot"></div>
              <span>Новости форума</span>
            </div>
            <a class="embed-title">Новый релиз: Discord RSS Bot v1.0.0</a>
            <div class="embed-desc">Forum RSS → красивые embed-посты в Discord с веб-админкой.
Фильтры, шаблоны, изображения, упоминания ролей.</div>
            <div class="embed-fields">
              <div class="field">
                <span class="field-name">Автор</span>
                <span class="field-value">Zver1o7</span>
              </div>
              <div class="field">
                <span class="field-name">Дата</span>
                <span class="field-value">04.11.2025</span>
              </div>
            </div>
            <div class="embed-image">
              <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200&auto=format&fit=crop" alt="">
            </div>
          </div>
          <div class="embed-footer">
            <span>Новости форума · GitHub: Zver1o7/Discord-RSS-Bot</span>
          </div>
        </div>
        <img class="embed-thumb" src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=400&auto=format&fit=crop" alt="">
      </div>
    </div>
  </div>
</div>
</body>
</html>
