<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#9b59b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#9b59b6"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="260" fill="#5865F2" opacity="0.10"/>
  <circle cx="60" cy="600" r="220" fill="#9b59b6" opacity="0.10"/>

  <!-- логотип-иконка -->
  <rect x="72" y="76" width="72" height="72" rx="18" fill="url(#accent)"/>
  <circle cx="100" cy="112" r="9" fill="#fff"/>
  <path d="M100 121 v22 M100 143 a22 22 0 0 0 22 -22 M100 143 a22 22 0 0 1 -22 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M118 94 a22 22 0 0 1 22 22 M82 94 a22 22 0 0 0 -22 22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- заголовок -->
  <text x="72" y="252" font-size="74" font-weight="700" fill="#e8eaf0" letter-spacing="-1">Discord RSS Bot</text>
  <text x="74" y="306" font-size="30" fill="#9aa0b0">Форум RSS → красивые embed-посты в Discord</text>
  <text x="74" y="348" font-size="24" fill="#6f7688">Картинки · фильтры · шаблоны · веб-админка в браузере</text>

  <!-- чипы технологий -->
  <g font-size="22" font-weight="600">
    <rect x="72" y="404" width="150" height="52" rx="26" fill="#1a1d24" stroke="#333947"/>
    <text x="147" y="437" fill="#e8eaf0" text-anchor="middle">Python</text>

    <rect x="238" y="404" width="190" height="52" rx="26" fill="#1a1d24" stroke="#333947"/>
    <text x="333" y="437" fill="#e8eaf0" text-anchor="middle">discord.py</text>

    <rect x="444" y="404" width="130" height="52" rx="26" fill="#1a1d24" stroke="#333947"/>
    <text x="509" y="437" fill="#e8eaf0" text-anchor="middle">Flask</text>

    <rect x="590" y="404" width="110" height="52" rx="26" fill="#1a1d24" stroke="#333947"/>
    <text x="645" y="437" fill="#e8eaf0" text-anchor="middle">MIT</text>
  </g>

  <text x="74" y="540" font-size="26" fill="#5865F2" font-weight="600">github.com/Zver1o7/discord-rss-bot</text>
  <text x="74" y="578" font-size="22" fill="#6f7688">Настройка за 5 минут · open source · v1.0.0</text>

  <!-- макет embed-поста -->
  <g>
    <rect x="800" y="120" width="416" height="400" rx="14" fill="#2b2d31"/>
    <rect x="800" y="120" width="8" height="400" rx="4" fill="url(#bar)"/>

    <!-- аватар-заглушка -->
    <circle cx="856" cy="170" r="22" fill="#5865F2"/>
    <rect x="892" y="158" width="180" height="14" rx="7" fill="#b5bac1"/>
    <rect x="892" y="180" width="110" height="10" rx="5" fill="#4e5058"/>

    <!-- заголовок и текст -->
    <rect x="832" y="222" width="330" height="20" rx="6" fill="#f2f3f5"/>
    <rect x="832" y="254" width="270" height="20" rx="6" fill="#dbdee1"/>
    <rect x="832" y="290" width="352" height="12" rx="6" fill="#949ba4"/>
    <rect x="832" y="312" width="320" height="12" rx="6" fill="#949ba4"/>
    <rect x="832" y="334" width="344" height="12" rx="6" fill="#949ba4"/>
    <rect x="832" y="356" width="210" height="12" rx="6" fill="#949ba4"/>

    <!-- картинка -->
    <rect x="832" y="384" width="352" height="64" rx="8" fill="#232428"/>
    <path d="M900 432 l40 -32 34 26 30 -22 46 40 z" fill="#3f4147"/>
    <circle cx="930" cy="412" r="7" fill="#5865F2" opacity="0.7"/>

    <!-- кнопка-ссылка -->
    <rect x="832" y="466" width="210" height="40" rx="8" fill="#4e5058"/>
    <text x="937" y="492" font-size="18" fill="#fff" text-anchor="middle">📖 Читать на форуме</text>

    <!-- плавающий статус -->
    <rect x="1090" y="86" width="150" height="46" rx="23" fill="#1a1d24" stroke="#3ba55c"/>
    <circle cx="1118" cy="109" r="7" fill="#3ba55c"/>
    <text x="1136" y="116" font-size="20" fill="#e8eaf0">Bot online</text>
  </g>
</svg>
